name: Audit
on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Run cargo audit
        id: audit
        # Write the JSON report regardless of exit code so the sync script
        # can normalize it. Capturing exit avoids the workflow failing on
        # advisories (we surface them via the issue tracker instead).
        run: |
          cargo audit --json > /tmp/audit.json || true
        continue-on-error: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ECOSYSTEM: cargo
          REPORT_PATH: /tmp/audit.json
        with:
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-audit-issues.js`);
            await sync({ github, context, core });

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: |
          pnpm audit --json > /tmp/audit.json || true
        continue-on-error: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ECOSYSTEM: pnpm
          REPORT_PATH: /tmp/audit.json
        with:
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-audit-issues.js`);
            await sync({ github, context, core });
