name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Verify docs CLAIMs map to code VERIFIED tags"
        run: bash scripts/verify-docs.sh

  verify-theme-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Verify TS theme keys match Rust tray-icon match arms"
        run: bash scripts/verify-theme-keys.sh

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  ts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest across all packages + app
        run: pnpm -r --filter "@snk/*" --filter @snk/app test

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux Tauri deps
        # All plugin crates depend on `tauri`, which transitively links to webkit2gtk
        # via wry. We need these headers even just to compile, not just to run.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev libdrm-dev
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --exclude snapper-keeper-app -- -D warnings
      - run: cargo test --workspace --exclude snapper-keeper-app

      # Cross-plugin internals are off-limits — consumers must use the
      # public re-exports from `snk_library::*`, not `snk_library::plugin::*`.
      - name: "Forbid snk_library::plugin:: reach-ins"
        run: |
          if grep -rn 'snk_library::plugin::' crates/; then
            echo "::error::Use the snk_library:: re-export instead of reaching into the plugin module."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev libdrm-dev
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Split per #45: logic surface is gated at 90%; IPC surface
      # (plugin.rs / commands.rs and the platform-bound code that
      # needs a real Tauri runtime) is reported only, no gate.
      # Pre-#45 the gate hid behind the exclusion list — high overall
      # coverage number while the IPC perimeter (where user-visible
      # failures live) was invisible.
      - name: Logic coverage (gated at 90%)
        # Excludes Tauri integration glue (plugins, command wrappers) and
        # platform-bound code (hotkeys, watcher, paste, caret, grab, orchestrate,
        # foreground) — those need a real Tauri runtime or live monitors/keyboard.
        run: |
          cargo llvm-cov --workspace --exclude snapper-keeper-app \
            --ignore-filename-regex '(plugin\.rs|commands\.rs|caret\.rs|paste\.rs|watcher\.rs|hotkeys.src.lib\.rs|queue\.rs|build\.rs|foreground\.rs|capture.src.grab\.rs|capture.src.orchestrate\.rs)' \
            --fail-under-lines 90 --summary-only
      - name: IPC-surface coverage (report only — no gate)
        # Inverse of the logic-coverage filter: only the files excluded
        # above. No --fail-under, so this never blocks the build. Tracked
        # quarterly to ensure IPC surface coverage trends up over time as
        # #53/#54 (tauri::test mock-app tests) land. Per #45 captured
        # decision: report honest IPC numbers instead of hiding them.
        run: |
          cargo llvm-cov --workspace --exclude snapper-keeper-app \
            --ignore-filename-regex '^(?!.*(plugin\.rs|commands\.rs|caret\.rs|paste\.rs|watcher\.rs|hotkeys.src.lib\.rs|queue\.rs|build\.rs|foreground\.rs|capture.src.grab\.rs|capture.src.orchestrate\.rs)).*$' \
            --summary-only || echo "::warning::IPC-surface coverage tool returned non-zero (likely no matching files); not gating"

  build-app:
    needs: [lint-typecheck, rust-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev libdrm-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snk/app build
      - run: cargo build -p snapper-keeper-app

  e2e-windows-smoke:
    # Intentional scope:
    # - Windows: full WebDriver smoke via tauri-driver + Edge WebDriver.
    # - macOS/Linux: compile + sign + verify stay in build/release jobs only.
    # Hosted macOS runners do not provide a stable display/WebKit WebDriver path.
    needs: [lint-typecheck, rust-test]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pinned Edge WebDriver matching runner Edge build
        shell: pwsh
        run: |
          $edgeVersion = (Get-Item "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          $edgeBuild = (($edgeVersion -split '\.')[0..2] -join '.')
          $driverVersion = (Invoke-RestMethod "https://msedgedriver.azureedge.net/LATEST_RELEASE_$edgeBuild").Trim()
          Invoke-WebRequest "https://msedgedriver.azureedge.net/$driverVersion/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\msedgedriver"
          "$env:RUNNER_TEMP\msedgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "EDGE_VERSION=$edgeVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSEDGEDRIVER_VERSION=$driverVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install tauri-driver
        run: cargo install --locked tauri-driver

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snk/app build
      - run: cargo build -p snapper-keeper-app

      - name: Run Windows E2E smoke
        shell: pwsh
        env:
          APP_BINARY_PATH: ${{ github.workspace }}\target\debug\snapper-keeper-app.exe
          E2E_ARTIFACT_DIR: ${{ github.workspace }}\e2e-artifacts
        run: |
          New-Item -ItemType Directory -Force -Path "$env:E2E_ARTIFACT_DIR" | Out-Null
          node e2e/windows-smoke.mjs

      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          $artifactRoot = "${{ github.workspace }}\e2e-artifacts"
          New-Item -ItemType Directory -Force -Path "$artifactRoot\app-logs" | Out-Null
          foreach ($base in @($env:APPDATA, $env:LOCALAPPDATA)) {
            if (-not $base) { continue }
            $logsDir = Join-Path $base "com.snapper-keeper.app\logs"
            if (Test-Path $logsDir) {
              $target = Join-Path "$artifactRoot\app-logs" ((Split-Path $base -Leaf) + "-logs")
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              Copy-Item "$logsDir\*" $target -Recurse -Force -ErrorAction Continue
            }
          }
          Set-Content -Path "$artifactRoot\versions.txt" -Value @(
            "EDGE_VERSION=$env:EDGE_VERSION"
            "MSEDGEDRIVER_VERSION=$env:MSEDGEDRIVER_VERSION"
          )

      - name: Upload Windows runtime artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-windows-runtime-artifacts
          path: ${{ github.workspace }}/e2e-artifacts
          if-no-files-found: error
