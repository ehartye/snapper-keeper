name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon, native arm64 build
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-15-intel        # native Intel runner — no cross-compile, no Rosetta
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev libdrm-dev

      - run: pnpm install --frozen-lockfile

      # Bundle Tesseract OCR + tessdata so the installed app doesn't need a
      # system tesseract. The resolver in snk-ocr/sidecar.rs prefers the
      # bundled location before falling back to PATH/system installs.
      - name: Bundle Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TESSERACT_VERSION: '5.5.0.20241111'
          TESSERACT_SHA256: 'F3FC4236425B690C8BE756F35793F77394EE004BE0A6460A440C754D892F68BC'
        run: |
          # --requirechecksums is a no-op for this package (the installer
          # ships inside the .nupkg rather than being fetched via
          # Get-ChocolateyWebFile), but kept as belt-and-suspenders in case
          # the package model changes upstream.
          choco install tesseract --version=$env:TESSERACT_VERSION --no-progress --confirm --requirechecksums

          # Tesseract's chocolatey package bundles an NSIS .exe (not .msi).
          $installer = (Get-ChildItem "$env:ChocolateyInstall\lib\tesseract" -Filter '*.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $installer) {
            Write-Error "Tesseract installer .exe not found after install"
            exit 1
          }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actual -ne $env:TESSERACT_SHA256) {
            Write-Error "Tesseract installer SHA256 mismatch. Expected: $env:TESSERACT_SHA256. Got: $actual."
            exit 1
          }
          Write-Host "Tesseract installer SHA256 verified."

          $src = 'C:\Program Files\Tesseract-OCR'
          $dest = 'app\src-tauri\resources\tesseract'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force
          Write-Host "Bundled tesseract:"
          Get-ChildItem $dest | Format-Table Name, Length

      # Windows signing: install .NET SDK + the dotnet `sign` CLI tool so
      # Tauri's bundler can invoke it via TAURI_WINDOWS_SIGN_COMMAND below.
      - name: Setup .NET (Windows signing)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.x'

      - name: Install dotnet sign tool (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Microsoft's sign tool only ships as 0.9.1-beta.* prereleases on
          # NuGet under the "sign" id, which collides with an unrelated
          # library "Sign 1.x" by Rafal Jasica (NOT a .NET tool). We resolve
          # the collision by version-pinning explicitly: the beta version
          # only exists in Microsoft's package. Do NOT add --prerelease;
          # dotnet rejects it alongside --version with
          # "The --prerelease and --version options are not supported in the same command".
          dotnet tool install --global sign --version 0.9.1-beta.26227.3
          # `dotnet tool install --global` puts tools in
          # %USERPROFILE%\.dotnet\tools but doesn't add that dir to PATH
          # for subsequent workflow steps. Append it to GITHUB_PATH so
          # Tauri's bundler can find `sign.exe` when it invokes the
          # `bundle.windows.signCommand` from tauri.conf.json.
          $toolsPath = "$env:USERPROFILE\.dotnet\tools"
          $toolsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added to GITHUB_PATH: $toolsPath"

      - name: Verify sign tool is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $signPath = (Get-Command sign -ErrorAction SilentlyContinue).Source
          if (-not $signPath) {
            Write-Error "sign tool NOT found on PATH"
            exit 1
          }
          Write-Host "sign tool located at: $signPath"
          sign --version

      # Smoke-test the sign command directly so any auth / syntax / network
      # error surfaces here with a real stderr instead of Tauri's opaque
      # "failed to run sign". Sign a copy of cmd.exe (already Microsoft-
      # signed; re-signing it as a test is harmless because we never
      # distribute it). The resulting Authenticode block proves the SP
      # credentials work end-to-end against Azure Artifact Signing.
      - name: Smoke-test sign tool against Azure Artifact Signing (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Copy-Item -Path "C:\Windows\System32\cmd.exe" -Destination ".\sign-smoke-test.exe"
          Write-Host "Invoking sign against .\sign-smoke-test.exe ..."
          sign code artifact-signing `
            -ase https://eus.codesigning.azure.net `
            -asa HartyeTech `
            -ascp snapper-keeper `
            -v Information `
            ".\sign-smoke-test.exe"
          $exit = $LASTEXITCODE
          Write-Host "sign exit code: $exit"
          if ($exit -ne 0) {
            Write-Error "sign tool failed against Azure Artifact Signing (exit $exit)"
            exit $exit
          }
          Write-Host "Sign succeeded. Verifying Authenticode signature on test file:"
          Get-AuthenticodeSignature ".\sign-smoke-test.exe" | Format-List Status, StatusMessage, SignerCertificate
          Remove-Item ".\sign-smoke-test.exe"

      # macOS: import signing certificate
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # Extend the keychain idle-lock timeout to 2 hours so it doesn't
          # auto-lock during long Rust compiles. Default macOS timeout is
          # 300s, which leaves codesign hanging forever waiting for an
          # interactive password prompt when the build exceeds 5 min — the
          # exact failure mode of v0.0.0-test5 macOS-x64 (10min compile,
          # codesign hung 49min then cancelled).
          security set-keychain-settings -t 7200 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      # Build with Tauri CLI — handles signing, bundling, and updater artifacts.
      # Windows signing uses Azure Artifact Signing via the `sign` CLI, which
      # is wired in through `bundle.windows.signCommand` in tauri.conf.json
      # (Tauri 2 ignores the old TAURI_WINDOWS_SIGN_COMMAND env var from
      # Tauri 1). The CLI reads AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET from
      # env via DefaultAzureCredential.
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows signing via Azure Artifact Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pnpm tauri build --target ${{ matrix.target }}

      # macOS: Tauri's updater bundler emits `Snapper Keeper.app.tar.gz` with
      # no arch in the filename, so both arm64 and x64 jobs collide on the same
      # release asset. Rename per-arch before upload so they survive separately.
      - name: Rename macOS updater payload per arch
        if: runner.os == 'macOS'
        run: |
          ARCH=$(echo "${{ matrix.target }}" | cut -d'-' -f1)
          cd "target/${{ matrix.target }}/release/bundle/macos"
          if [ -f "Snapper Keeper.app.tar.gz" ]; then
            mv "Snapper Keeper.app.tar.gz" "Snapper.Keeper_${ARCH}.app.tar.gz"
          fi
          if [ -f "Snapper Keeper.app.tar.gz.sig" ]; then
            mv "Snapper Keeper.app.tar.gz.sig" "Snapper.Keeper_${ARCH}.app.tar.gz.sig"
          fi
          ls -la

      # macOS: notarize the .app bundle
      - name: Notarize macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG_PATH" ]; then
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG_PATH"
          fi

      # Upload artifacts for the release job. The Cargo workspace puts the
      # build output at `target/` (workspace root), not under app/src-tauri/.
      # Tauri 2 attaches Windows updater signatures directly to the installer
      # as `*-setup.exe.sig` (no separate .nsis.zip like Tauri 1 used).
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: Clean up certificates
        if: always()
        shell: bash
        run: |
          rm -f certificate.p12

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="Release $VERSION"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Collect platform entries
          PLATFORMS='{}'

          # macOS aarch64
          MAC_ARM_TAR=$(find artifacts -name "*.app.tar.gz" -path "*aarch64*" | head -1)
          MAC_ARM_SIG=$(find artifacts -name "*.app.tar.gz.sig" -path "*aarch64*" | head -1)
          if [ -n "$MAC_ARM_TAR" ] && [ -n "$MAC_ARM_SIG" ]; then
            SIG=$(cat "$MAC_ARM_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$MAC_ARM_TAR")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"darwin-aarch64": {"url": $url, "signature": $sig}}')
          fi

          # macOS x86_64
          MAC_X64_TAR=$(find artifacts -name "*.app.tar.gz" -path "*x86_64*" | head -1)
          MAC_X64_SIG=$(find artifacts -name "*.app.tar.gz.sig" -path "*x86_64*" | head -1)
          if [ -n "$MAC_X64_TAR" ] && [ -n "$MAC_X64_SIG" ]; then
            SIG=$(cat "$MAC_X64_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$MAC_X64_TAR")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"darwin-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Windows x86_64 — Tauri 2 attaches the signature directly to the
          # installer .exe; updater points users at the .exe URL and verifies
          # against the .sig file.
          WIN_EXE=$(find artifacts -name "*-setup.exe" -not -name "*.sig" | head -1)
          WIN_SIG=$(find artifacts -name "*-setup.exe.sig" | head -1)
          if [ -n "$WIN_EXE" ] && [ -n "$WIN_SIG" ]; then
            SIG=$(cat "$WIN_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$WIN_EXE")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"windows-x86_64": {"url": $url, "signature": $sig}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/**/*.dmg \
            artifacts/**/*.app.tar.gz \
            artifacts/**/*.app.tar.gz.sig \
            artifacts/**/*-setup.exe \
            artifacts/**/*-setup.exe.sig \
            latest.json
