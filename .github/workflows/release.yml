name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-pubkey:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install minisign + jq
        run: sudo apt-get update && sudo apt-get install -y minisign jq
      - name: Verify TAURI_SIGNING_PRIVATE_KEY matches tauri.conf.json pubkey
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/verify-pubkey.sh

  # Spec §10.5 enforced gate (issue #44): re-run every automatable lint / clippy
  # / test / verify gate against the tagged commit before anything is built or
  # signed. The release pipeline otherwise never re-runs these (they live in
  # ci.yml for PRs), so a tag on a non-green commit would slip through. The
  # manual §10.5 items are confirmed by the approver at the production-release
  # environment gate; this script prints them.
  release-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev libwayland-dev libdrm-dev
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release-readiness gate (spec §10.5 automated)
        run: bash scripts/release-readiness.sh --ci

  build:
    needs: [verify-pubkey, release-readiness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Universal binary (arm64 + x86_64 via lipo) — release artifact
            target: universal-apple-darwin
            label: macOS-universal
            bundles: 'app'
            store_edition: false
          - os: macos-latest          # Apple Silicon, native arm64 — test exercise (TT6)
            target: aarch64-apple-darwin
            label: macOS-arm64
            bundles: 'app'
            store_edition: false
          - os: macos-15-intel        # native Intel runner — test exercise (TT6)
            target: x86_64-apple-darwin
            label: macOS-x64
            bundles: 'app'
            store_edition: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: 'nsis'
            store_edition: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64-Store
            bundles: 'nsis'
            store_edition: true

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # universal-apple-darwin is not a real Rust target; Tauri uses lipo
          # to merge aarch64 + x86_64 slices, so both targets must be installed.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Build with NO signing secrets in env.
      #
      # `createUpdaterArtifacts: false` is critical here. An earlier attempt
      # overrode `plugins.updater.pubkey` to "" hoping Tauri would interpret
      # that as "no pubkey, skip updater minisign". It does not: Tauri sees
      # ANY pubkey value (including "") as "pubkey configured", then errors
      # with "A public key has been found, but no private key. Make sure to
      # set TAURI_SIGNING_PRIVATE_KEY environment variable." — exactly
      # because we INTENTIONALLY haven't set that env var. Setting
      # createUpdaterArtifacts: false skips the updater bundler entirely,
      # which is what we want: the sign jobs recreate the updater payload
      # (tar of signed .app + minisign on macOS; minisign on signed installer
      # on Windows) from the platform-signed artifacts.
      #
      # `shell: bash` is required: on windows-latest the default shell is
      # PowerShell, which tokenizes the inline JSON --config argument
      # differently and breaks the bundler. Git Bash is preinstalled on
      # Windows runners.
      - name: Build Tauri app (unsigned)
        shell: bash
        run: |
          extra_flags=()
          if [[ "${{ matrix.store_edition }}" == "true" ]]; then
            export SNK_STORE_EDITION=1
            extra_flags+=(--features store-edition)
          fi

          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            "${extra_flags[@]}" \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # macOS universal: upload the .app directory. The sign job will codesign
      # the universal .app (which contains both arm64 and x86_64 slices), then
      # rebuild a single .dmg from the signed .app, tar the signed .app to
      # make .app.tar.gz, then minisign the tar.
      #
      # Per-arch builds (macOS-arm64, macOS-x64) run for test exercise only
      # (TT6) and do not upload artifacts here.
      #
      # Path glob is `macos/**` rather than `macos/Snapper Keeper.app/**`:
      # upload-artifact uses the common ancestor of matched files as the
      # archive root. With `.app/**` the common ancestor is the .app
      # directory itself, which strips `Snapper Keeper.app/` from the
      # archive paths — the sign job would then need to reconstruct it.
      # Uploading from `macos/**` preserves `Snapper Keeper.app/...` as a
      # subdirectory in the archive (and incidentally also picks up the
      # unsigned .app.tar.gz that the bundler emits for the updater; the
      # sign job ignores that and recreates it post-codesign).
      - name: Upload unsigned macOS artifacts
        if: matrix.target == 'universal-apple-darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-artifacts-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/**
          if-no-files-found: error

      - name: Upload unsigned Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-artifacts-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  artifact-verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: unsigned-artifacts-*

      - name: Summarize artifacts
        run: |
          echo "## Unsigned build artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | File | Size (bytes) | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"

          find artifacts -type f | sort | while read -r f; do
            # Skip Mac .app directory contents inside Info.plist etc.; report
            # only top-level installer-shaped files.
            case "$f" in
              *.exe|*.dmg|*.app.tar.gz|*.app/Contents/MacOS/*) ;;
              *) continue ;;
            esac
            platform=$(echo "$f" | awk -F/ '{print $2}' | sed 's/^unsigned-artifacts-//')
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf "| %s | %s | %s | %s |\n" "$platform" "$name" "$size" "$sha" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review this table before approving the production-release environment gate." >> "$GITHUB_STEP_SUMMARY"

  sign-mac-universal:
    needs: artifact-verify
    runs-on: macos-latest
    environment: production-release
    permissions:
      contents: read
    env:
      LABEL: macOS-universal
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # smoke-sign-roundtrip.sh runs `cargo build` for the host arch only;
          # the universal .app was already built in the build job.
          targets: aarch64-apple-darwin

      - name: Install minisign, jq, create-dmg
        run: brew install minisign jq create-dmg

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-artifacts-${{ env.LABEL }}
          path: artifacts/unsigned

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # 2-hour keychain idle timeout — default 300s causes codesign to
          # hang waiting for password prompt when build exceeds 5 min.
          security set-keychain-settings -t 7200 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Smoke-test signing toolchain
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/smoke-sign-roundtrip.sh macos

      - name: Codesign .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="artifacts/unsigned/Snapper Keeper.app"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --deep "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Rebuild .dmg from signed .app
        run: |
          mkdir -p artifacts/signed
          create-dmg \
            --volname "Snapper Keeper" \
            --window-size 600 400 \
            --icon-size 100 \
            "artifacts/signed/Snapper.Keeper.dmg" \
            "artifacts/unsigned/Snapper Keeper.app"

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="artifacts/signed/Snapper.Keeper.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Tar signed .app for updater payload
        run: |
          cd artifacts/unsigned
          tar -czf "../signed/Snapper.Keeper.app.tar.gz" "Snapper Keeper.app"

      - name: Minisign the updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          WORK=$(mktemp -d)
          # tr -d '\r' before base64 -d: portable defense against CR
          # mangling (Git Bash on Windows surfaces secret env vars with
          # spurious CRs). No-op on Linux/macOS.
          echo "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$WORK/priv.key"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s "$WORK/priv.key" \
            -m "artifacts/signed/Snapper.Keeper.app.tar.gz" \
            -x "artifacts/signed/Snapper.Keeper.app.tar.gz.sig"
          rm -rf "$WORK"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-${{ env.LABEL }}
          path: |
            artifacts/signed/*.dmg
            artifacts/signed/*.app.tar.gz
            artifacts/signed/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Clean up certificates
        if: always()
        run: rm -f certificate.p12

  sign-win-x64:
    needs: artifact-verify
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: read
    env:
      LABEL: Windows-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '9.x'

      - name: Install dotnet sign tool
        shell: powershell
        run: |
          # Pinned Microsoft prerelease — see PR #90 for the package-id
          # collision post-mortem (Sign 1.x by Rafal Jasica vs Microsoft's
          # 0.9.1-beta.* tool under the same NuGet id).
          dotnet tool install --global sign --version 0.9.1-beta.26227.3
          $toolsPath = "$env:USERPROFILE\.dotnet\tools"
          $toolsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install minisign
        shell: powershell
        run: choco install minisign --no-progress --confirm

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-artifacts-${{ env.LABEL }}
          path: artifacts/unsigned

      - name: Smoke-test signing toolchain
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ./scripts/smoke-sign-roundtrip.sh windows

      - name: Authenticode-sign the installer
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $exe = (Get-ChildItem artifacts/unsigned -Filter '*-setup.exe' | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "No -setup.exe found"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifacts/signed | Out-Null
          $signed = Join-Path 'artifacts/signed' (Split-Path -Leaf $exe)
          Copy-Item $exe $signed
          sign code artifact-signing `
            -ase https://eus.codesigning.azure.net `
            -asa HartyeTech `
            -ascp snapper-keeper `
            -v Information `
            $signed
          # Use PowerShell's native Get-AuthenticodeSignature instead of
          # signtool.exe. signtool ships with the Windows SDK but is not
          # on PATH for default PowerShell sessions on windows-latest
          # runners (it lives at C:\Program Files (x86)\Windows Kits\10
          # \bin\<ver>\x64\signtool.exe). Get-AuthenticodeSignature is
          # built into PowerShell and gives equivalent verification.
          $sig = Get-AuthenticodeSignature $signed
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode verify failed: $($sig.Status) - $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "Authenticode verify: $($sig.Status) (signer: $($sig.SignerCertificate.Subject))"

      - name: Minisign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXE=$(find artifacts/signed -name '*-setup.exe' | head -1)
          WORK=$(mktemp -d)
          # tr -d '\r' strips CR that Git Bash on Windows can inject when
          # reading GitHub Actions secrets from env. Portable across GNU
          # base64 (Linux) and BSD base64 (macOS) — can't use `-i` /
          # --ignore-garbage since BSD reuses `-i` for input-file.
          echo "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$WORK/priv.key"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s "$WORK/priv.key" \
            -m "$EXE" -x "$EXE.sig"
          rm -rf "$WORK"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-${{ env.LABEL }}
          path: |
            artifacts/signed/*-setup.exe
            artifacts/signed/*-setup.exe.sig
          if-no-files-found: error

  publish-release:
    needs: [sign-mac-universal, sign-win-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: signed-artifacts-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="Release $VERSION"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Collect platform entries
          PLATFORMS='{}'

          # macOS universal — both darwin-aarch64 and darwin-x86_64 point to
          # the same universal binary so the Tauri updater serves all Mac
          # architectures from a single artifact.
          # GitHub Releases rewrites spaces to '.' in stored asset names, but
          # the local bundle names carry a space (productName "Snapper Keeper").
          # The updater fetches the manifest URL verbatim, so the URL must use
          # the *stored* (dotted) name or it 404s ("download failed"). Mirror
          # GitHub's rewrite with `tr ' ' '.'`. Surfaced post-v0.2.1.
          MAC_TAR=$(find artifacts -name "*.app.tar.gz" | head -1)
          MAC_SIG=$(find artifacts -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$MAC_TAR" ] && [ -n "$MAC_SIG" ]; then
            # latest.json's `signature` must be BASE64 of the .sig file:
            # tauri-plugin-updater base64-decodes this field before handing it
            # to minisign (verify_signature -> base64_to_string). Storing raw
            # .sig text makes the updater reject every update with "signature
            # verification failed" — base64 chokes on the space in "untrusted
            # comment:". Surfaced post-v0.2.1.
            SIG=$(base64 -w0 < "$MAC_SIG")
            MAC_NAME=$(basename "$MAC_TAR" | tr ' ' '.')
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${MAC_NAME}"
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg url "$URL" --arg sig "$SIG" \
              '. + {"darwin-aarch64": {"url": $url, "signature": $sig}, "darwin-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Windows x86_64 — Tauri 2 attaches the signature directly to the
          # installer .exe; updater points users at the .exe URL and verifies
          # against the .sig file.
          WIN_EXE=$(find artifacts -name "*-setup.exe" -not -name "*.sig" | head -1)
          WIN_SIG=$(find artifacts -name "*-setup.exe.sig" | head -1)
          if [ -n "$WIN_EXE" ] && [ -n "$WIN_SIG" ]; then
            # base64 of the .sig — see the macOS note above.
            SIG=$(base64 -w0 < "$WIN_SIG")
            WIN_NAME=$(basename "$WIN_EXE" | tr ' ' '.')
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${WIN_NAME}"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"windows-x86_64": {"url": $url, "signature": $sig}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Actions runs scripts in non-interactive bash where ** is
          # treated as * (single segment) by default. shopt -s globstar
          # enables recursive ** so the patterns below match whether the
          # artifacts are flat (merge-multiple: true puts them at
          # artifacts/X.dmg) or nested under a subdirectory.
          shopt -s globstar nullglob
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/**/*.dmg \
            artifacts/**/*.app.tar.gz \
            artifacts/**/*.app.tar.gz.sig \
            artifacts/**/*-setup.exe \
            artifacts/**/*-setup.exe.sig \
            latest.json

      - name: Verify update manifest (URLs resolve + signatures verify)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # End-to-end guard on the PUBLISHED manifest, exercised exactly as the
          # updater does it. For each platform: download the artifact at the
          # manifest URL (a 404 from a name mismatch fails here — the v0.2.0/
          # v0.2.1 "download failed" bug), base64-decode the manifest signature
          # field (tauri-plugin-updater base64-decodes it before minisign — the
          # v0.2.0/v0.2.1 "signature verification failed" bug), and minisign-
          # verify against the pubkey the app actually embeds (tauri.conf.json).
          # Both prior release bugs were invisible to CI because this path only
          # runs against real signed artifacts; this step makes it a gate.
          sudo apt-get update && sudo apt-get install -y minisign jq
          jq -r '.plugins.updater.pubkey' app/src-tauri/tauri.conf.json | base64 -d > updater.pub
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --output live.json
          fail=0
          while read -r plat; do
            url=$(jq -r --arg p "$plat" '.platforms[$p].url' live.json)
            name=$(basename "$url")
            echo "::group::verify $plat ($name)"
            if ! gh release download "$GITHUB_REF_NAME" --pattern "$name" --output art --clobber; then
              echo "::error::manifest URL did not resolve for $plat: $url"; fail=1
              echo "::endgroup::"; continue
            fi
            jq -r --arg p "$plat" '.platforms[$p].signature' live.json | base64 -d > art.sig
            if minisign -V -p updater.pub -m art -x art.sig; then
              echo "OK: $plat"
            else
              echo "::error::signature verification FAILED for $plat ($name)"; fail=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.platforms | keys[]' live.json)
          [ "$fail" -eq 0 ] || { echo "Update manifest verification failed."; exit 1; }

      # --- CycloneDX SBOM generation (#46) ---
      # Generates a merged Rust + npm SBOM and attaches it to the release
      # as sbom.cdx.json. Tooling is installed inline since publish-release
      # didn't previously need rust/node setup.

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        # version not specified here — pnpm/action-setup v6+ errors when
        # both `with: version:` AND `packageManager` in package.json
        # are present. We let packageManager drive the version.

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install cyclonedx-cli
        env:
          CDX_CLI_VERSION: '0.32.0'
        run: |
          # cyclonedx-cli is a .NET binary distributed on GitHub releases
          # (NOT npm). Used for merge + validate.
          curl -fsSL "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CDX_CLI_VERSION}/cyclonedx-linux-x64" -o /tmp/cyclonedx
          chmod +x /tmp/cyclonedx
          sudo mv /tmp/cyclonedx /usr/local/bin/cyclonedx
          cyclonedx --version

      - name: Generate Rust SBOM (from Cargo.lock)
        run: |
          # cdxgen -t cargo reads Cargo.lock directly — works for any
          # workspace layout, no cargo install required. Earlier attempts
          # used cargo-cyclonedx but `--all --override-filename` produced
          # no findable output (probably because the workspace root has
          # no [package] section). cdxgen sidesteps that.
          pnpm dlx @cyclonedx/cdxgen@12.4.3 -t cargo -o ./bom-rust.cdx.json .
          echo "Rust SBOM:"
          ls -la ./bom-rust.cdx.json

      - name: Generate npm SBOM
        run: |
          # cdxgen -t pnpm reads pnpm-lock.yaml directly. cyclonedx-npm
          # runs `npm ls` internally and fails on pnpm's symlinked
          # node_modules layout.
          pnpm dlx @cyclonedx/cdxgen@12.4.3 -t pnpm -o ./bom-npm.cdx.json .
          echo "npm SBOM:"
          ls -la ./bom-npm.cdx.json

      - name: Merge SBOMs
        run: |
          cyclonedx merge \
            --input-files ./bom-rust.cdx.json ./bom-npm.cdx.json \
            --output-file ./sbom.cdx.json
          echo "Merged SBOM:"
          ls -la ./sbom.cdx.json

      - name: Validate SBOM
        run: cyclonedx validate --input-file ./sbom.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./sbom.cdx.json --clobber
