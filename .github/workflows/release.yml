name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-pubkey:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install minisign + jq
        run: sudo apt-get update && sudo apt-get install -y minisign jq
      - name: Verify TAURI_SIGNING_PRIVATE_KEY matches tauri.conf.json pubkey
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/verify-pubkey.sh

  build:
    needs: verify-pubkey
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon, native arm64 build
            target: aarch64-apple-darwin
            label: macOS-arm64
            bundles: 'app'
          - os: macos-15-intel        # native Intel runner — no cross-compile, no Rosetta
            target: x86_64-apple-darwin
            label: macOS-x64
            bundles: 'app'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: 'nsis'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Bundle Tesseract OCR + tessdata so the installed app doesn't need a
      # system tesseract. The resolver in snk-ocr/sidecar.rs prefers the
      # bundled location before falling back to PATH/system installs.
      - name: Bundle Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TESSERACT_VERSION: '5.5.0.20241111'
          TESSERACT_SHA256: 'F3FC4236425B690C8BE756F35793F77394EE004BE0A6460A440C754D892F68BC'
        run: |
          choco install tesseract --version=$env:TESSERACT_VERSION --no-progress --confirm --requirechecksums
          # Tesseract's chocolatey package bundles an NSIS .exe (not .msi).
          $installer = (Get-ChildItem "$env:ChocolateyInstall\lib\tesseract" -Filter '*.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $installer) { Write-Error "Tesseract installer .exe not found"; exit 1 }
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actual -ne $env:TESSERACT_SHA256) {
            Write-Error "Tesseract installer SHA256 mismatch. Expected: $env:TESSERACT_SHA256. Got: $actual."
            exit 1
          }
          $src = 'C:\Program Files\Tesseract-OCR'
          $dest = 'app\src-tauri\resources\tesseract'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$src\*" -Destination $dest -Recurse -Force

      # Windows: delete bundle.windows.signCommand from tauri.conf.json
      # before building. The build job is secrets-free, so it cannot
      # invoke `dotnet sign` (no Azure creds). Attempts to disable the
      # signCommand via --config overlay don't work:
      #   - `signCommand: ""` -> Tauri tries to exec the empty command
      #     and fails with "program path has no file name".
      #   - `signCommand: null` -> unverified at time of writing; jq -d
      #     is the robust fix that just removes the field entirely.
      # The sign-win-x64 job runs `dotnet sign` against the unsigned
      # installer instead.
      - name: Strip signCommand from tauri.conf.json (Windows build)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jq 'del(.bundle.windows.signCommand)' app/src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json app/src-tauri/tauri.conf.json
          echo "windows.signCommand after patch:"
          jq '.bundle.windows.signCommand // "(absent)"' app/src-tauri/tauri.conf.json

      # Build with NO signing secrets in env.
      #
      # `createUpdaterArtifacts: false` is critical here. An earlier attempt
      # overrode `plugins.updater.pubkey` to "" hoping Tauri would interpret
      # that as "no pubkey, skip updater minisign". It does not: Tauri sees
      # ANY pubkey value (including "") as "pubkey configured", then errors
      # with "A public key has been found, but no private key. Make sure to
      # set TAURI_SIGNING_PRIVATE_KEY environment variable." — exactly
      # because we INTENTIONALLY haven't set that env var. Setting
      # createUpdaterArtifacts: false skips the updater bundler entirely,
      # which is what we want: the sign jobs recreate the updater payload
      # (tar of signed .app + minisign on macOS; minisign on signed installer
      # on Windows) from the platform-signed artifacts.
      #
      # `shell: bash` is required: on windows-latest the default shell is
      # PowerShell, which tokenizes the inline JSON --config argument
      # differently and breaks the bundler. Git Bash is preinstalled on
      # Windows runners.
      - name: Build Tauri app (unsigned)
        shell: bash
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # macOS: upload the .app directory. The sign job will codesign the .app,
      # then rebuild .dmg from the signed .app, tar the signed .app to make
      # .app.tar.gz, then minisign the tar.
      #
      # Path glob is `macos/**` rather than `macos/Snapper Keeper.app/**`:
      # upload-artifact uses the common ancestor of matched files as the
      # archive root. With `.app/**` the common ancestor is the .app
      # directory itself, which strips `Snapper Keeper.app/` from the
      # archive paths — the sign job would then need to reconstruct it.
      # Uploading from `macos/**` preserves `Snapper Keeper.app/...` as a
      # subdirectory in the archive (and incidentally also picks up the
      # unsigned .app.tar.gz that the bundler emits for the updater; the
      # sign job ignores that and recreates it post-codesign).
      - name: Upload unsigned macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-artifacts-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/**
          if-no-files-found: error

      - name: Upload unsigned Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-artifacts-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  artifact-verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: unsigned-artifacts-*

      - name: Summarize artifacts
        run: |
          echo "## Unsigned build artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | File | Size (bytes) | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"

          find artifacts -type f | sort | while read -r f; do
            # Skip Mac .app directory contents inside Info.plist etc.; report
            # only top-level installer-shaped files.
            case "$f" in
              *.exe|*.dmg|*.app.tar.gz|*.app/Contents/MacOS/*) ;;
              *) continue ;;
            esac
            platform=$(echo "$f" | awk -F/ '{print $2}' | sed 's/^unsigned-artifacts-//')
            name=$(basename "$f")
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf "| %s | %s | %s | %s |\n" "$platform" "$name" "$size" "$sha" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review this table before approving the production-release environment gate." >> "$GITHUB_STEP_SUMMARY"

  sign-mac-arm:
    needs: artifact-verify
    runs-on: macos-latest
    environment: production-release
    permissions:
      contents: read
    env:
      LABEL: macOS-arm64
      ARCH: aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install minisign, jq, create-dmg
        run: brew install minisign jq create-dmg

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-artifacts-${{ env.LABEL }}
          path: artifacts/unsigned

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          # 2-hour keychain idle timeout — default 300s causes codesign to
          # hang waiting for password prompt when build exceeds 5 min.
          security set-keychain-settings -t 7200 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Smoke-test signing toolchain
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/smoke-sign-roundtrip.sh macos

      - name: Codesign .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="artifacts/unsigned/Snapper Keeper.app"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --deep "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Rebuild .dmg from signed .app
        run: |
          mkdir -p artifacts/signed
          create-dmg \
            --volname "Snapper Keeper" \
            --window-size 600 400 \
            --icon-size 100 \
            "artifacts/signed/Snapper Keeper.dmg" \
            "artifacts/unsigned/Snapper Keeper.app"

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="artifacts/signed/Snapper Keeper.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Tar signed .app for updater payload
        run: |
          cd artifacts/unsigned
          tar -czf "../signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz" "Snapper Keeper.app"

      - name: Minisign the updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          WORK=$(mktemp -d)
          # tr -d '\r' before base64 -d: portable defense against CR
          # mangling (Git Bash on Windows surfaces secret env vars with
          # spurious CRs). No-op on Linux/macOS.
          echo "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$WORK/priv.key"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s "$WORK/priv.key" \
            -m "artifacts/signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz" \
            -x "artifacts/signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz.sig"
          rm -rf "$WORK"

      - name: Rename .dmg per-arch
        run: |
          cd artifacts/signed
          mv "Snapper Keeper.dmg" "Snapper.Keeper_${{ env.ARCH }}.dmg"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-${{ env.LABEL }}
          path: |
            artifacts/signed/*.dmg
            artifacts/signed/*.app.tar.gz
            artifacts/signed/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Clean up certificates
        if: always()
        run: rm -f certificate.p12

  sign-mac-x64:
    needs: artifact-verify
    runs-on: macos-15-intel
    environment: production-release
    permissions:
      contents: read
    env:
      LABEL: macOS-x64
      ARCH: x86_64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-apple-darwin

      - name: Install minisign, jq, create-dmg
        run: brew install minisign jq create-dmg

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-artifacts-${{ env.LABEL }}
          path: artifacts/unsigned

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 7200 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Smoke-test signing toolchain
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/smoke-sign-roundtrip.sh macos

      - name: Codesign .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="artifacts/unsigned/Snapper Keeper.app"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --deep "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Rebuild .dmg from signed .app
        run: |
          mkdir -p artifacts/signed
          create-dmg \
            --volname "Snapper Keeper" \
            --window-size 600 400 \
            --icon-size 100 \
            "artifacts/signed/Snapper Keeper.dmg" \
            "artifacts/unsigned/Snapper Keeper.app"

      - name: Notarize .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="artifacts/signed/Snapper Keeper.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Tar signed .app for updater payload
        run: |
          cd artifacts/unsigned
          tar -czf "../signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz" "Snapper Keeper.app"

      - name: Minisign the updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          WORK=$(mktemp -d)
          # tr -d '\r' before base64 -d: portable defense against CR
          # mangling (Git Bash on Windows surfaces secret env vars with
          # spurious CRs). No-op on Linux/macOS.
          echo "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$WORK/priv.key"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s "$WORK/priv.key" \
            -m "artifacts/signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz" \
            -x "artifacts/signed/Snapper.Keeper_${{ env.ARCH }}.app.tar.gz.sig"
          rm -rf "$WORK"

      - name: Rename .dmg per-arch
        run: |
          cd artifacts/signed
          mv "Snapper Keeper.dmg" "Snapper.Keeper_${{ env.ARCH }}.dmg"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-${{ env.LABEL }}
          path: |
            artifacts/signed/*.dmg
            artifacts/signed/*.app.tar.gz
            artifacts/signed/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Clean up certificates
        if: always()
        run: rm -f certificate.p12

  sign-win-x64:
    needs: artifact-verify
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: read
    env:
      LABEL: Windows-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '9.x'

      - name: Install dotnet sign tool
        shell: powershell
        run: |
          # Pinned Microsoft prerelease — see PR #90 for the package-id
          # collision post-mortem (Sign 1.x by Rafal Jasica vs Microsoft's
          # 0.9.1-beta.* tool under the same NuGet id).
          dotnet tool install --global sign --version 0.9.1-beta.26227.3
          $toolsPath = "$env:USERPROFILE\.dotnet\tools"
          $toolsPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install minisign
        shell: powershell
        run: choco install minisign --no-progress --confirm

      - name: Download unsigned artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-artifacts-${{ env.LABEL }}
          path: artifacts/unsigned

      - name: Smoke-test signing toolchain
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ./scripts/smoke-sign-roundtrip.sh windows

      - name: Authenticode-sign the installer
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $exe = (Get-ChildItem artifacts/unsigned -Filter '*-setup.exe' | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "No -setup.exe found"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifacts/signed | Out-Null
          $signed = Join-Path 'artifacts/signed' (Split-Path -Leaf $exe)
          Copy-Item $exe $signed
          sign code artifact-signing `
            -ase https://eus.codesigning.azure.net `
            -asa HartyeTech `
            -ascp snapper-keeper `
            -v Information `
            $signed
          # Use PowerShell's native Get-AuthenticodeSignature instead of
          # signtool.exe. signtool ships with the Windows SDK but is not
          # on PATH for default PowerShell sessions on windows-latest
          # runners (it lives at C:\Program Files (x86)\Windows Kits\10
          # \bin\<ver>\x64\signtool.exe). Get-AuthenticodeSignature is
          # built into PowerShell and gives equivalent verification.
          $sig = Get-AuthenticodeSignature $signed
          if ($sig.Status -ne 'Valid') {
            Write-Error "Authenticode verify failed: $($sig.Status) - $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "Authenticode verify: $($sig.Status) (signer: $($sig.SignerCertificate.Subject))"

      - name: Minisign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXE=$(find artifacts/signed -name '*-setup.exe' | head -1)
          WORK=$(mktemp -d)
          # tr -d '\r' strips CR that Git Bash on Windows can inject when
          # reading GitHub Actions secrets from env. Portable across GNU
          # base64 (Linux) and BSD base64 (macOS) — can't use `-i` /
          # --ignore-garbage since BSD reuses `-i` for input-file.
          echo "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r' | base64 -d > "$WORK/priv.key"
          echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s "$WORK/priv.key" \
            -m "$EXE" -x "$EXE.sig"
          rm -rf "$WORK"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-artifacts-${{ env.LABEL }}
          path: |
            artifacts/signed/*-setup.exe
            artifacts/signed/*-setup.exe.sig
          if-no-files-found: error

  publish-release:
    needs: [sign-mac-arm, sign-mac-x64, sign-win-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: signed-artifacts-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="Release $VERSION"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Collect platform entries
          PLATFORMS='{}'

          # macOS aarch64
          MAC_ARM_TAR=$(find artifacts -name "*.app.tar.gz" -path "*aarch64*" | head -1)
          MAC_ARM_SIG=$(find artifacts -name "*.app.tar.gz.sig" -path "*aarch64*" | head -1)
          if [ -n "$MAC_ARM_TAR" ] && [ -n "$MAC_ARM_SIG" ]; then
            SIG=$(cat "$MAC_ARM_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$MAC_ARM_TAR")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"darwin-aarch64": {"url": $url, "signature": $sig}}')
          fi

          # macOS x86_64
          MAC_X64_TAR=$(find artifacts -name "*.app.tar.gz" -path "*x86_64*" | head -1)
          MAC_X64_SIG=$(find artifacts -name "*.app.tar.gz.sig" -path "*x86_64*" | head -1)
          if [ -n "$MAC_X64_TAR" ] && [ -n "$MAC_X64_SIG" ]; then
            SIG=$(cat "$MAC_X64_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$MAC_X64_TAR")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"darwin-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Windows x86_64 — Tauri 2 attaches the signature directly to the
          # installer .exe; updater points users at the .exe URL and verifies
          # against the .sig file.
          WIN_EXE=$(find artifacts -name "*-setup.exe" -not -name "*.sig" | head -1)
          WIN_SIG=$(find artifacts -name "*-setup.exe.sig" | head -1)
          if [ -n "$WIN_EXE" ] && [ -n "$WIN_SIG" ]; then
            SIG=$(cat "$WIN_SIG")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$WIN_EXE")"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$URL" --arg sig "$SIG" '. + {"windows-x86_64": {"url": $url, "signature": $sig}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Actions runs scripts in non-interactive bash where ** is
          # treated as * (single segment) by default. shopt -s globstar
          # enables recursive ** so the patterns below match whether the
          # artifacts are flat (merge-multiple: true puts them at
          # artifacts/X.dmg) or nested under a subdirectory.
          shopt -s globstar nullglob
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/**/*.dmg \
            artifacts/**/*.app.tar.gz \
            artifacts/**/*.app.tar.gz.sig \
            artifacts/**/*-setup.exe \
            artifacts/**/*-setup.exe.sig \
            latest.json
