[workspace]
resolver = "2"
members = [
    "crates/snk-library",
    "crates/snk-hotkeys",
    "crates/snk-capture",
    "crates/snk-annotate",
    "crates/snk-clipboard",
    "crates/snk-ocr",
    "crates/snk-pii",
    "crates/snk-updater",
    "app/src-tauri",
    "tests/fixtures/smoke-target",
]

[workspace.package]
edition = "2021"
# 1.81 is the real floor: app/src-tauri/src/logging.rs uses
# std::panic::PanicHookInfo, stabilized in 1.81 (the pre-1.81 PanicInfo is
# deprecated on current toolchains). The prior "1.78" was already inaccurate.
rust-version = "1.81"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2" }
tauri-plugin = { version = "2", features = ["build"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled", "uuid"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v7", "serde"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
arboard = "3"
sha2 = "0.10"
dirs = "5"
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
