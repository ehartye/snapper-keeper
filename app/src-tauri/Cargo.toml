[package]
name = "snapper-keeper-app"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
store-edition = []

[dependencies]
# `devtools` is intentionally enabled for release builds too: open-source
# dev-facing app — end users may need to inspect issues for bug reports.
# (Tauri auto-enables devtools in debug; the feature flag is required for
# release.) Toggle off here if shipping to non-developer audiences.
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "devtools"] }
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-opener.workspace = true
snk-library = { path = "../../crates/snk-library" }
snk-hotkeys = { path = "../../crates/snk-hotkeys" }
snk-capture = { path = "../../crates/snk-capture" }
snk-annotate = { path = "../../crates/snk-annotate" }
snk-clipboard = { path = "../../crates/snk-clipboard" }
snk-ocr = { path = "../../crates/snk-ocr" }
snk-updater = { path = "../../crates/snk-updater" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
